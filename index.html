<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysioBook</title>

    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
        import { getDatabase, ref, get, child, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpmljSMd8dB7esFXwV_fA1XCzJCg3dp-8",
            authDomain: "physiobooksite.firebaseapp.com",
            databaseURL: "https://physiobooksite-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "physiobooksite",
            storageBucket: "physiobooksite.firebasestorage.app",
            messagingSenderId: "760895644002",
            appId: "1:760895644002:web:a8bf7ab2ed5e7ec7d3cc3b",
            measurementId: "G-Q7QSXNNG54"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        // ====== EMAILJS КОНФИГУРАЦИЯ ======
        const EMAILJS_PUBLIC_KEY = "jpsBNWlPSXnHXHOCA";
        const EMAILJS_SERVICE_ID = "service_813jud7";
        const EMAILJS_TEMPLATE_ID = "template_19ek2jk";
        const RECEIVER_EMAIL = "atodorov434@gmail.com";

        emailjs.init(EMAILJS_PUBLIC_KEY);

        // ====== АБОНАМЕНТИ ======
        window.loadSubscriptions = async function() {
            const dbRef = ref(db);
            const contentDiv = document.getElementById('subs-content');
            contentDiv.innerHTML = '<p style="color:#cbd5e1;">Зареждане...</p>';

            try {
                const snapshot = await get(child(dbRef, 'subscriptions'));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    let html = '<div class="subs-grid">';
                    for (const [key, sub] of Object.entries(data)) {
                        const name = sub.name || key;
                        let price = sub.price || '';
                        const modules = sub.modules || [];
                        const description = (typeof sub === 'string') ? sub : '';

                        let priceHtml = price;
                        if (price && !price.toLowerCase().includes('год')) {
                            if (/^[\d€$]/.test(price.trim())) {
                                priceHtml = price + ' / година';
                            }
                        }

                        const modulesHtml = modules.length > 0
                            ? modules.map(m => `<li><span class="check">✓</span><span>${m}</span></li>`).join('')
                            : (description ? `<li><span class="check">✓</span><span>${description}</span></li>` : '');

                        html += `
                            <div class="sub-card">
                                <h3 class="sub-name">${name}</h3>
                                <div class="sub-price">${priceHtml}</div>
                                <div class="divider"></div>
                                <ul class="sub-modules">${modulesHtml}</ul>
                                <div class="notice">За да закупите план трябва да се свържете с нас</div>
                            </div>
                        `;
                    }
                    html += '</div>';
                    contentDiv.innerHTML = html;
                } else {
                    contentDiv.innerHTML = '<p style="color:#cbd5e1;">Все още няма добавени абонаменти.</p>';
                }
            } catch (error) {
                console.error(error);
                contentDiv.innerHTML = '<p style="color:#f87171;">Грешка при зареждане.</p>';
            }
        };

        // ====== КОНТАКТИ ======
        window.loadContacts = async function() {
            const dbRef = ref(db);
            const contentDiv = document.getElementById('contacts-content');
            contentDiv.innerHTML = '<p style="color:#cbd5e1;">Зареждане...</p>';

            try {
                const snapshot = await get(child(dbRef, 'contacts'));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    let html = '<div class="contacts-grid">';

                    if (data.phone || data.email || data.address) {
                        html += `
                            <div class="contact-card">
                                <h3>📞 Контакт</h3>
                                ${data.phone ? `<p><strong>Телефон:</strong> ${data.phone}</p>` : ''}
                                ${data.email ? `<p><strong>Имейл:</strong> ${data.email}</p>` : ''}
                                ${data.address ? `<p><strong>Адрес:</strong> ${data.address}</p>` : ''}
                            </div>
                        `;
                    } else {
                        for (const [key, contact] of Object.entries(data)) {
                            html += `
                                <div class="contact-card">
                                    <h3 class="contact-name">👤 ${contact.name || 'Контакт'}</h3>
                                    ${contact.phone ? `
                                        <p class="contact-line">
                                            <span class="label">📞 Телефон:</span>
                                            <a href="tel:${contact.phone}" class="value">${contact.phone}</a>
                                        </p>
                                    ` : ''}
                                    ${contact.email ? `
                                        <p class="contact-line">
                                            <span class="label">✉️ Имейл:</span>
                                            <a href="mailto:${contact.email}" class="value">${contact.email}</a>
                                        </p>
                                    ` : ''}
                                </div>
                            `;
                        }
                    }
                    html += '</div>';
                    contentDiv.innerHTML = html;
                } else {
                    contentDiv.innerHTML = '<p style="color:#cbd5e1;">Няма добавени контакти.</p>';
                }
            } catch (error) {
                console.error(error);
                contentDiv.innerHTML = '<p style="color:#f87171;">Грешка при зареждане.</p>';
            }
        };

        // ====== ИЗПРАЩАНЕ НА ПРЕДЛОЖЕНИЕ ======
        window.sendSuggestion = async function() {
            const name = document.getElementById('sug-name').value.trim();
            const email = document.getElementById('sug-email').value.trim();
            const message = document.getElementById('sug-message').value.trim();
            const statusDiv = document.getElementById('suggestion-status');
            const btn = document.getElementById('sug-btn');

            if (!name || !email || !message) {
                statusDiv.style.color = '#f87171';
                statusDiv.textContent = 'Моля, попълни всички полета!';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Изпращане...';
            statusDiv.textContent = '';

            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    from_name: name,
                    from_email: email,
                    message: message,
                    to_email: RECEIVER_EMAIL
                });

                statusDiv.style.color = '#2dd4bf';
                statusDiv.textContent = '✅ Благодарим! Предложението ти беше изпратено.';
                document.getElementById('sug-name').value = '';
                document.getElementById('sug-email').value = '';
                document.getElementById('sug-message').value = '';
            } catch (error) {
                console.error(error);
                statusDiv.style.color = '#f87171';
                statusDiv.textContent = '❌ Възникна грешка. Моля, опитай отново.';
            } finally {
                btn.disabled = false;
                btn.textContent = '📨 Изпрати предложение';
            }
        };

        // ====== ЗАРЕЖДАНЕ НА ОТЗИВИ ======
        window.loadReviews = async function() {
            const dbRef = ref(db);
            const contentDiv = document.getElementById('reviews-list');
            contentDiv.innerHTML = '<p style="color:#cbd5e1;">Зареждане...</p>';

            try {
                const snapshot = await get(child(dbRef, 'reviews'));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    let html = '<div class="reviews-grid">';

                    const reviews = Object.entries(data)
                        .map(([key, value]) => ({ key, ...value }))
                        .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                    for (const review of reviews) {
                        const stars = '★'.repeat(review.rating || 0) + '☆'.repeat(5 - (review.rating || 0));
                        const date = review.timestamp 
                            ? new Date(review.timestamp).toLocaleDateString('bg-BG') 
                            : '';
                        html += `
                            <div class="review-card">
                                <div class="review-header">
                                    <strong>${review.name || 'Анонимен'}</strong>
                                    <span class="review-date">${date}</span>
                                </div>
                                <div class="review-stars">${stars}</div>
                                <p class="review-text">${review.text || ''}</p>
                            </div>
                        `;
                    }
                    html += '</div>';
                    contentDiv.innerHTML = html;
                } else {
                    contentDiv.innerHTML = '<p style="color:#cbd5e1;">Все още няма отзиви. Бъди първият!</p>';
                }
            } catch (error) {
                console.error(error);
                contentDiv.innerHTML = '<p style="color:#f87171;">Грешка при зареждане.</p>';
            }
        };

        // ====== ДОБАВЯНЕ НА ОТЗИВ ======
        window.submitReview = async function() {
            const name = document.getElementById('rev-name').value.trim();
            const text = document.getElementById('rev-text').value.trim();
            const rating = parseInt(document.querySelector('input[name="rating"]:checked')?.value || 0);
            const statusDiv = document.getElementById('review-status');
            const btn = document.getElementById('rev-btn');

            if (!name || !text || !rating) {
                statusDiv.style.color = '#f87171';
                statusDiv.textContent = 'Моля, попълни име, оценка и текст!';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Изпращане...';
            statusDiv.textContent = '';

            try {
                const newRef = push(ref(db, 'reviews'));
                await set(newRef, {
                    name: name,
                    text: text,
                    rating: rating,
                    timestamp: Date.now()
                });

                statusDiv.style.color = '#2dd4bf';
                statusDiv.textContent = '✅ Благодарим за отзива!';
                document.getElementById('rev-name').value = '';
                document.getElementById('rev-text').value = '';
                document.querySelectorAll('input[name="rating"]').forEach(r => r.checked = false);

                loadReviews();
            } catch (error) {
                console.error(error);
                statusDiv.style.color = '#f87171';
                statusDiv.textContent = '❌ Възникна грешка. Моля, опитай отново.';
            } finally {
                btn.disabled = false;
                btn.textContent = '⭐ Изпрати отзив';
            }
        };
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        html, body {
            min-height: 100%;
        }

        body {
            /* 🌟 СНИМКАТА КАТО ФОН */
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #0b2b4f;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Тъмен overlay за по-добра четимост на текста */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 43, 79, 0.55);
            z-index: 0;
            pointer-events: none;
        }

        /* Всичко над overlay */
        nav, .page {
            position: relative;
            z-index: 1;
        }

        nav {
            background-color: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 15px 30px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-item {
            text-decoration: none;
            color: white;
            padding: 10px 15px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
            user-select: none;
        }

        .nav-item:hover { background-color: rgba(255, 255, 255, 0.1); color: #2dd4bf; }
        .nav-item.active { color: #2dd4bf; background-color: rgba(45, 212, 191, 0.15); }

        .page { display: none; flex: 1; padding: 40px 20px; text-align: center; }
        .page.active { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        #page-home.active { justify-content: center; }

        .logo-container { margin-bottom: 20px; }
        .logo-container svg {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0 0 25px rgba(45, 212, 191, 0.5));
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 40px;
            letter-spacing: 3px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
        }

        .buttons-container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }

        .btn {
            text-decoration: none;
            color: #0b2b4f;
            background-color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-width: 200px;
            display: inline-block;
        }
        .btn:hover {
            background-color: #2dd4bf;
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(45, 212, 191, 0.5);
        }

        .content-box { max-width: 1200px; width: 100%; margin: 0 auto; }
        .page h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #2dd4bf;
            text-shadow: 0 2px 15px rgba(0,0,0,0.7);
        }

        .subs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
            align-items: stretch;
        }

        .sub-card {
            background: rgba(30, 74, 122, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(45, 212, 191, 0.3);
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }
        .sub-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.55);
            border-color: #2dd4bf;
        }
        .sub-name { font-size: 1.8rem; font-weight: 700; color: #ffffff; margin-bottom: 20px; }
        .sub-price { font-size: 1.7rem; font-weight: 600; color: #2dd4bf; margin-bottom: 25px; }
        .divider { border-top: 1px dashed rgba(45, 212, 191, 0.4); margin: 15px 0 25px; }

        .sub-modules { list-style: none; text-align: left; margin-bottom: 25px; flex: 1; }
        .sub-modules li { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; font-size: 1rem; color: #e2e8f0; line-height: 1.4; }
        .check { color: #2dd4bf; font-weight: 700; font-size: 1.2rem; flex-shrink: 0; line-height: 1.4; }

        .notice {
            background: rgba(45, 212, 191, 0.15);
            color: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px dashed #2dd4bf;
            margin-top: auto;
        }

        .contacts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; width: 100%; }

        .contact-card {
            background: rgba(30, 74, 122, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            border-left: 5px solid #2dd4bf;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            min-width: 0;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .contact-card h3 { color: #2dd4bf; font-size: 1.2rem; margin-bottom: 15px; line-height: 1.3; overflow-wrap: anywhere; word-break: break-word; }
        .contact-line { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; margin: 10px 0; font-size: 1rem; line-height: 1.5; min-width: 0; }
        .contact-line .label { color: #94a3b8; font-weight: 600; flex-shrink: 0; white-space: nowrap; }
        .contact-line .value { color: #2dd4bf; text-decoration: none; font-weight: 600; overflow-wrap: anywhere; word-break: break-word; min-width: 0; flex: 1; }
        .contact-line .value:hover { text-decoration: underline; }
        .contact-card p { margin: 8px 0; font-size: 1rem; color: #e2e8f0; line-height: 1.5; overflow-wrap: anywhere; word-break: break-word; }
        .contact-card strong { color: #94a3b8; margin-right: 5px; }
        .contact-card a { color: #2dd4bf; text-decoration: none; font-weight: 600; }
        .contact-card a:hover { text-decoration: underline; }

        .form-box {
            background: rgba(30, 74, 122, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 15px;
            max-width: 700px;
            margin: 0 auto 40px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(45, 212, 191, 0.3);
        }

        .form-box h3 { color: #2dd4bf; font-size: 1.4rem; margin-bottom: 20px; text-align: center; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.95rem; color: #cbd5e1; font-weight: 600; }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #0b2b4f;
            background: rgba(11, 43, 79, 0.9);
            color: white;
            font-size: 1rem;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus { outline: none; border-color: #2dd4bf; }
        .form-group textarea { min-height: 120px; resize: vertical; }

        .form-btn {
            background: #2dd4bf;
            color: #0b2b4f;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .form-btn:hover:not(:disabled) { background: #22b8a6; transform: translateY(-2px); }
        .form-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .form-status { margin-top: 15px; text-align: center; font-weight: 600; min-height: 24px; }

        .rating-stars { display: flex; flex-direction: row-reverse; justify-content: center; gap: 5px; margin-top: 8px; }
        .rating-stars input { display: none; }
        .rating-stars label { font-size: 2.5rem; color: #64748b; cursor: pointer; transition: color 0.2s, transform 0.2s; }
        .rating-stars label:hover,
        .rating-stars label:hover ~ label,
        .rating-stars input:checked ~ label { color: #fbbf24; }
        .rating-stars label:hover { transform: scale(1.15); }

        .reviews-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; text-align: left; }

        .review-card {
            background: rgba(30, 74, 122, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #2dd4bf;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 5px; }
        .review-header strong { color: #ffffff; font-size: 1.05rem; }
        .review-date { color: #94a3b8; font-size: 0.85rem; }
        .review-stars { color: #fbbf24; font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 10px; }
        .review-text { color: #e2e8f0; font-size: 0.98rem; line-height: 1.5; overflow-wrap: anywhere; word-break: break-word; }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .page h2 { font-size: 1.8rem; }
            .buttons-container { flex-direction: column; gap: 15px; }
            .btn { width: 100%; }
            nav { justify-content: center; padding: 12px; gap: 8px; }
            .nav-item { padding: 8px 12px; font-size: 0.85rem; }
            .sub-card { padding: 30px 20px; }
            .sub-name { font-size: 1.5rem; }
            .sub-price { font-size: 1.4rem; }
            .contacts-grid { grid-template-columns: 1fr; }
            .contact-line .value { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <nav>
        <span class="nav-item active" id="nav-home" onclick="showPage('home')">Начало</span>
        <span class="nav-item" id="nav-subs" onclick="showPage('subs')">Абонаменти</span>
        <span class="nav-item" id="nav-contacts" onclick="showPage('contacts')">Контакти</span>
        <span class="nav-item" id="nav-suggestions" onclick="showPage('suggestions')">Предложения</span>
        <span class="nav-item" id="nav-reviews" onclick="showPage('reviews')">Отзиви</span>
    </nav>

    <div class="page active" id="page-home">
        <div class="logo-container">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="90" fill="rgba(11,43,79,0.7)" stroke="#2dd4bf" stroke-width="4"/>
                <circle cx="100" cy="100" r="75" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.6"/>
                <circle cx="100" cy="65" r="12" fill="#2dd4bf"/>
                <rect x="92" y="82" width="16" height="50" rx="8" fill="#2dd4bf"/>
                <circle cx="100" cy="90" r="3" fill="#0b2b4f"/>
                <circle cx="100" cy="100" r="3" fill="#0b2b4f"/>
                <circle cx="100" cy="110" r="3" fill="#0b2b4f"/>
                <circle cx="100" cy="120" r="3" fill="#0b2b4f"/>
                <path d="M 70 80 Q 100 55 130 80" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
                <path d="M 70 135 Q 100 150 130 135" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>
        <h1>PhysioBook</h1>
        <div class="buttons-container">
            <a href="https://app.physiobook.eu" class="btn">За пациенти</a>
            <a href="https://app.physiobook.eu" class="btn">За служители</a>
        </div>
    </div>

    <div class="page" id="page-subs">
        <div class="content-box">
            <h2>Нашите Абонаменти</h2>
            <div id="subs-content">Зареждане...</div>
        </div>
    </div>

    <div class="page" id="page-contacts">
        <div class="content-box">
            <h2>Свържете се с нас</h2>
            <div id="contacts-content">Зареждане...</div>
        </div>
    </div>

    <div class="page" id="page-suggestions">
        <div class="content-box">
            <h2>Направи предложение</h2>
            <div class="form-box">
                <h3>💡 Имаш идея? Пиши ни!</h3>
                <div class="form-group">
                    <label>Твоето име</label>
                    <input type="text" id="sug-name" placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Твоят имейл</label>
                    <input type="email" id="sug-email" placeholder="ivan@example.com">
                </div>
                <div class="form-group">
                    <label>Твоето предложение</label>
                    <textarea id="sug-message" placeholder="Какво можем да добавим или подобрим?"></textarea>
                </div>
                <button class="form-btn" id="sug-btn" onclick="sendSuggestion()">📨 Изпрати предложение</button>
                <div class="form-status" id="suggestion-status"></div>
            </div>
        </div>
    </div>

    <div class="page" id="page-reviews">
        <div class="content-box">
            <h2>Отзиви от нашите клиенти</h2>

            <div class="form-box">
                <h3>⭐ Сподели своя опит</h3>
                <div class="form-group">
                    <label>Твоето име</label>
                    <input type="text" id="rev-name" placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Оценка</label>
                    <div class="rating-stars">
                        <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
                        <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                        <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                        <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                        <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Твоят отзив</label>
                    <textarea id="rev-text" placeholder="Сподели своето мнение за PhysioBook..."></textarea>
                </div>
                <button class="form-btn" id="rev-btn" onclick="submitReview()">⭐ Изпрати отзив</button>
                <div class="form-status" id="review-status"></div>
            </div>

            <h2 style="font-size: 1.8rem; margin-top: 40px;">Какво казват другите</h2>
            <div id="reviews-list">Зареждане...</div>
        </div>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById('page-' + pageId).classList.add('active');
            document.getElementById('nav-' + pageId).classList.add('active');

            if (pageId === 'subs' && typeof window.loadSubscriptions === 'function') window.loadSubscriptions();
            if (pageId === 'contacts' && typeof window.loadContacts === 'function') window.loadContacts();
            if (pageId === 'reviews' && typeof window.loadReviews === 'function') window.loadReviews();

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>

</body>
</html>
