<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysioBook - Контакти</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpmljSMd8dB7esFXwV_fA1XCzJCg3dp-8",
            authDomain: "physiobooksite.firebaseapp.com",
            databaseURL: "https://physiobooksite-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "physiobooksite",
            storageBucket: "physiobooksite.firebasestorage.app",
            messagingSenderId: "760895644002",
            appId: "1:760895644002:web:a8bf7ab2ed5e7ec7d3cc3b",
            measurementId: "G-Q7QSXNNG54"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        async function loadContacts() {
            const dbRef = ref(db);
            try {
                const snapshot = await get(child(dbRef, 'contacts'));
                const contentDiv = document.getElementById('contacts-content');
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    contentDiv.innerHTML = `
                        <div class="contact-item"><strong>📞 Телефон:</strong> ${data.phone || 'Няма въведен'}</div>
                        <div class="contact-item"><strong>✉️ Имейл:</strong> ${data.email || 'Няма въведен'}</div>
                        <div class="contact-item"><strong>📍 Адрес:</strong> ${data.address || 'Няма въведен'}</div>
                    `;
                } else {
                    contentDiv.innerHTML = '<p>Няма въведена информация за контакти.</p>';
                }
            } catch (error) {
                console.error("Грешка:", error);
                document.getElementById('contacts-content').innerHTML = '<p>Грешка при зареждане.</p>';
            }
        }
        loadContacts();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b2b4f; color: white; min-height: 100vh; display: flex; flex-direction: column; }
        nav { background-color: rgba(0,0,0,0.2); padding: 15px 30px; display: flex; justify-content: flex-end; gap: 20px; }
        .nav-item { text-decoration: none; color: white; padding: 10px 15px; font-weight: 600; border-radius: 5px; transition: 0.3s; }
        .nav-item:hover { background-color: rgba(255,255,255,0.1); color: #2dd4bf; }
        
        .container { flex: 1; padding: 40px; max-width: 800px; margin: 0 auto; width: 100%; text-align: center; }
        h1 { margin-bottom: 30px; font-size: 2.5rem; }
        
        .contact-item { background: rgba(255,255,255,0.1); padding: 20px; margin: 15px 0; border-radius: 10px; font-size: 1.2rem; text-align: left; border-left: 5px solid #2dd4bf; }
        .contact-item strong { color: #2dd4bf; margin-right: 10px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-item">Начало</a>
        <a href="subscriptions.html" class="nav-item">Абонаменти</a>
        <a href="contacts.html" class="nav-item" style="color:#2dd4bf;">Контакти</a>
    </nav>
    <div class="container">
        <h1>Свържете се с нас</h1>
        <div id="contacts-content">Зареждане...</div>
    </div>
</body>
</html>
